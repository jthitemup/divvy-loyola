# Runs the demand-model notebook on GitHub's servers (which can download Divvy trip
# files and weather), then saves the executed notebook and trained model to the repo.
# Start it from the Actions tab: "Train demand model" > "Run workflow".
name: Train demand model

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Trip months to use (comma-separated, YYYYMM)"
        default: "202606,202607,202608,202609,202610"

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install
        run: pip install -r model/requirements.txt

      - name: Run notebook
        env:
          TRIP_MONTHS: ${{ inputs.months }}
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=3600 notebooks/02_demand_model.ipynb

      - name: Save results
        run: |
          git config user.name "divvy-trainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/02_demand_model.ipynb model/artifacts
          git commit -q -m "Train demand model ($TRIP_MONTHS)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
        env:
          TRIP_MONTHS: ${{ inputs.months }}
